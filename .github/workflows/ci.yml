name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify Node version
        run: node --version | grep -E '^v24\.'

      - name: Install locked dependencies
        run: npm ci

      - name: Check OpenAPI contract drift
        run: npm run api:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build

      - name: Build Nginx image
        run: docker build --tag adept-frontend:ci .

      - name: Verify Nginx config and limit behavior
        run: npm run nginx:verify -- adept-frontend:ci

  auth-e2e:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the frontend under adept-frontend/.
      - name: Check out frontend
        uses: actions/checkout@v6
        with:
          path: adept-frontend

      - name: Resolve API and engine refs
        id: companion-refs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMPANION_REF: ${{ github.head_ref }}
        run: |
          api_ref="main"
          engine_ref="main"

          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$COMPANION_REF" ]; then
            if git ls-remote --exit-code \
              https://github.com/adept-industries/adept-api.git \
              "refs/heads/$COMPANION_REF" >/dev/null 2>&1; then
              api_ref="$COMPANION_REF"
            fi
            if git ls-remote --exit-code \
              https://github.com/adept-industries/adept-engine.git \
              "refs/heads/$COMPANION_REF" >/dev/null 2>&1; then
              engine_ref="$COMPANION_REF"
            fi
          fi

          echo "Using API ref: $api_ref"
          echo "Using engine ref: $engine_ref"
          echo "api_ref=$api_ref" >> "$GITHUB_OUTPUT"
          echo "engine_ref=$engine_ref" >> "$GITHUB_OUTPUT"

      # 2. Check out adept-api under adept-api/.
      - name: Check out adept-api
        uses: actions/checkout@v6
        with:
          repository: adept-industries/adept-api
          ref: ${{ steps.companion-refs.outputs.api_ref }}
          path: adept-api

      # 3. Check out adept-engine under adept-engine/.
      - name: Check out adept-engine
        uses: actions/checkout@v6
        with:
          repository: adept-industries/adept-engine
          ref: ${{ steps.companion-refs.outputs.engine_ref }}
          path: adept-engine

      # 4. Compare OpenAPI contract byte-for-byte.
      - name: Verify OpenAPI contract matches adept-api
        run: |
          diff adept-frontend/openapi/adept-api-v1.json \
               adept-api/docs/openapi/adept-api-v1.json

      # 5. Set up Node using the frontend's version file.
      - uses: actions/setup-node@v6
        with:
          node-version-file: adept-frontend/.nvmrc
          cache: npm
          cache-dependency-path: adept-frontend/package-lock.json

      # 6. Install dependencies and Playwright browsers.
      - name: Install dependencies
        working-directory: adept-frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: adept-frontend
        run: npx playwright install --with-deps chromium

      # 7. Copy .env from the api's example file and add required secrets.
      - name: Prepare .env
        run: |
          cp adept-api/infra/local/.env.example .env 2>/dev/null || \
          cat adept-frontend/.env.example > .env
          # Override with GitHub Actions env values (no secrets printed).
          {
            echo "POSTGRES_PASSWORD=ci_test_password"
            echo "APP_JWT_SECRET_BASE64=uFM7eCgnN/svOKK+rrowrCPRVWW9B0ViyGcvEd1OKB0="
            echo "APP_TOKEN_HASH_PEPPER_BASE64=EYtJZ0FaHmr/foRXWOx35DXWFpK9I/vwWsEcQSYWHHU="
            echo "APP_INTEGRATION_ENCRYPTION_KEY_V1_BASE64=GUAAKQnXLwy+hgTxBypD7VsALcNScTdFhqvtDjvzE8Y="
            echo "APP_INTEGRATION_ENCRYPTION_ACTIVE_KEY_VERSION=1"
            echo "APP_INTERNAL_ENGINE_TOKEN=ci-engine-token"
            echo "APP_COOKIE_SECURE=false"
            echo "APP_FRONTEND_BASE_URL=http://localhost:3000"
            echo "APP_PUBLIC_API_BASE_URL=http://localhost:8080"
            echo "APP_ENGINE_BASE_URL=http://engine-api:8000"
          } >> .env

      # 8. Start the full Compose stack and wait for all services.
      - name: Start Compose stack
        run: |
          docker compose \
            --project-name adept-phase2-e2e \
            --env-file .env \
            -f adept-api/infra/local/compose.yaml \
            --profile full up -d --build --wait --wait-timeout 180

      # Poll Mailpit and frontend explicitly (no healthchecks in compose for these).
      - name: Wait for Mailpit
        run: |
          curl --fail --silent --show-error \
            --retry 60 --retry-delay 2 --retry-max-time 120 \
            --retry-connrefused --retry-all-errors \
            http://localhost:8025/api/v1/info > /dev/null

      - name: Wait for frontend
        run: |
          curl --fail --silent --show-error \
            --retry 60 --retry-delay 2 --retry-max-time 120 \
            --retry-connrefused --retry-all-errors \
            http://localhost:3000/ > /dev/null

      # 9. Run Playwright tests.
      - name: Run E2E tests
        working-directory: adept-frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: "true"
        run: npx playwright test

      # 10. Show service state and logs on failure (without printing secrets).
      - name: Show Compose logs on failure
        if: failure()
        run: |
          if [ -f .env ]; then
            docker compose \
              --project-name adept-phase2-e2e \
              --env-file .env \
              -f adept-api/infra/local/compose.yaml \
              --profile full ps
            docker compose \
              --project-name adept-phase2-e2e \
              --env-file .env \
              -f adept-api/infra/local/compose.yaml \
              --profile full logs --no-color --tail=100 api
          fi

      # 11. Always stop the stack.
      - name: Tear down Compose stack
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose \
              --project-name adept-phase2-e2e \
              --env-file .env \
              -f adept-api/infra/local/compose.yaml \
              --profile full down -v --remove-orphans
          fi
