http {
    # ── Rate limiting zone ─────────────────────────────────────────────────
    # This is a client-IP spray ceiling for the directly exposed Nginx service.
    # Meaningful per-account limits are enforced by the API.
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=60r/m;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ── Global body size cap ───────────────────────────────────────────
        client_max_body_size 16k;

        # ── Security headers ───────────────────────────────────────────────
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ── Auth API location (rate-limited) ───────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth_per_ip burst=20 nodelay;
            limit_req_status 429;
            client_max_body_size 16k;

            proxy_pass http://api:8080/api/v1/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Overwrite — never append client-supplied values.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # ── SSE PR Risk Stream (Unbuffered) ───────────────────────────────
        location /api/pr-risk/stream {
            proxy_pass http://api:8080/api/pr-risk/stream;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
        }

        # ── General API location ───────────────────────────────────────────
        location /api/ {
            proxy_pass http://api:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # ── SPA fallback ───────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Proxy-generated 413 (body too large) ──────────────────────────
        error_page 413 = @error_413;
        location @error_413 {
            default_type application/problem+json;
            add_header Content-Type "application/problem+json" always;
            add_header X-Trace-Id $request_id always;
            return 413 '{"type":"https://adept.local/problems/payload-too-large","title":"Payload too large","status":413,"detail":"The request body exceeds the maximum allowed size.","instance":"/api","code":"PAYLOAD_TOO_LARGE","traceId":"$request_id"}';
        }

        # ── Proxy-generated 429 (rate limited) ────────────────────────────
        error_page 429 = @error_429;
        location @error_429 {
            default_type application/problem+json;
            add_header Content-Type "application/problem+json" always;
            add_header Retry-After 1 always;
            add_header X-Trace-Id $request_id always;
            return 429 '{"type":"https://adept.local/problems/rate-limited","title":"Too many requests","status":429,"detail":"You have sent too many requests. Please slow down.","instance":"/api/v1/auth","code":"RATE_LIMITED","traceId":"$request_id"}';
        }
    }
}

events {
    worker_connections 1024;
}
